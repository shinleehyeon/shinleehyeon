name: Update Age

on:
  schedule:
    # 매일 00:10 KST (UTC 15:10 전날)
    - cron: "10 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_age.py"
      - ".github/workflows/update-age.yml"

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update age section
        run: python .github/scripts/update_age.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No age changes"
            exit 0
          fi
          git commit -m "chore: update age and birthday countdown"
          git push
